name: Deploy to server

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Never run two deploys at once - they would race on the remote manifest.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  sftp-deploy:
    name: SFTP deploy
    runs-on: ubuntu-latest
    env:
      # Hostinger shared hosting: SSH/SFTP is on port 65002 and must be
      # enabled in hPanel -> Advanced -> SSH Access. FTP_SERVER is the SSH IP
      # shown there, FTP_USERNAME the SSH user, FTP_PASSWORD its password.
      # FTP_SERVER_DIR is relative to the SSH home (this account uses
      # websites/<site>/public_html, not public_html).
      SFTP_HOST: ${{ secrets.FTP_SERVER }}
      SFTP_USER: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SFTP_PORT: ${{ secrets.FTP_PORT || '65002' }}
      REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html' }}
      # Kept inside application/, which .htaccess denies to the web.
      MANIFEST: application/.deploy-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build file manifest
        run: |
          # Tracked files plus the composer-built vendor/. Never uploaded:
          # CI files, the source zip (it holds config with DB passwords),
          # customer uploads, and the GeoIP database (installed on the server
          # by `php index.php GeoIpTool update`).
          { git ls-files; find vendor -type f; } \
            | grep -v -E '^(\.github/|\.git|application\.zip$|upload/|application/geoip/.*\.(mmdb|gz)$)|(^|/)\.DS_Store$' \
            | sort -u > /tmp/files.txt
          tr '\n' '\0' < /tmp/files.txt | xargs -0 sha1sum | sort -k2 > /tmp/manifest.new
          echo "$(wc -l < /tmp/manifest.new) files in this release"

      - name: Check server and fetch previous manifest
        run: |
          cat > /tmp/lftp-open <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          open --env-password -u "$SFTP_USER" -p "$SFTP_PORT" "sftp://$SFTP_HOST"
          cd "$REMOTE_DIR"
          EOF

          # Refuse to deploy unless REMOTE_DIR really is this site, so a
          # wrong path can't spray files over the wrong folder.
          if ! lftp -f <(cat /tmp/lftp-open; echo 'cls -1 application/config/config.php index.php') ; then
            echo "::error::Could not connect, or '$REMOTE_DIR' is not the site root (no application/config/config.php there). Check FTP_SERVER / FTP_PORT / FTP_USERNAME / FTP_PASSWORD and set FTP_SERVER_DIR to the folder holding application/ below (without the trailing /application/config/config.php). Folders found:"
            lftp -e "set sftp:auto-confirm yes; set net:max-retries 1; open --env-password -u \"$SFTP_USER\" -p \"$SFTP_PORT\" \"sftp://$SFTP_HOST\"; cls -la . ; cls -la websites/ ; find --maxdepth=3 websites/ ; bye" || true
            exit 1
          fi

          rm -f /tmp/manifest.old
          lftp -f <(cat /tmp/lftp-open; echo "get \"$MANIFEST\" -o /tmp/manifest.old") || true
          touch /tmp/manifest.old

      - name: Upload changed files
        run: |
          # Lines (hash + path) that are new or changed since the last deploy.
          # Files deleted from git are left on the server, as before.
          comm -13 <(sort /tmp/manifest.old) <(sort /tmp/manifest.new) | cut -c43- > /tmp/changed.txt
          count=$(wc -l < /tmp/changed.txt)
          echo "$count file(s) to upload"
          if [ "$count" -eq 0 ]; then exit 0; fi

          {
            cat /tmp/lftp-open
            # mput -d recreates each file's directory; 8 parallel transfers.
            split -l 200 /tmp/changed.txt /tmp/chunk.
            for chunk in /tmp/chunk.*; do
              printf 'mput -d -P 8'
              while IFS= read -r f; do printf ' "%s"' "$f"; done < "$chunk"
              printf '\n'
            done
            # Manifest last, only reached if every upload above succeeded.
            echo "put /tmp/manifest.new -o \"$MANIFEST\""
          } > /tmp/lftp-upload
          lftp -f /tmp/lftp-upload
          echo "Deployed $count file(s)"
